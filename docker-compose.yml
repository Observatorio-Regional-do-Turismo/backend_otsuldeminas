services:
  redis:
    container_name: redis
    image: redis:7
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    container_name: migrate
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/otsuldeminas/
    command: uv run manage.py makemigrations; uv run manage.py migrate
    env_file: .env
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - UV_LINK_MODE=copy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  django:
    container_name: django
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/otsuldeminas/
    command: uv run manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - UV_LINK_MODE=copy
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery:
    container_name: celery
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/otsuldeminas/
    command: uv run celery --app=otsuldeminas worker -l INFO -E
    env_file: .env
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - UV_LINK_MODE=copy
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  beat:
    container_name: beat
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/otsuldeminas/
    command: uv run celery --app=otsuldeminas beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - UV_LINK_MODE=copy
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redisdata:
  pgdata: